ge":"../images/fmd-edition-3d/vic_tour_2026/vic_victory.jpg","sourceIds":[6028],"albums":[],"sourceCategories":["VicRattlehead"],"badges":["ORIGINAL FMD"],"currentCategory":"Reimaginados FMD","inReimagined":true,"suspiciousName":false},{"designId":"cd-megadeth-megadeth--vic-warheads-fmd","name":"Vic Warheads FMD","image":"../images/fmd-edition-3d/vic_tour_2026/vic_warheads.jpg","sourceIds":[6028],"albums":[],"sourceCategories":["VicRattlehead"],"badges":["ORIGINAL FMD"],"currentCategory":"Reimaginados FMD","inReimagined":true,"suspiciousName":false},{"designId":"cd-megadeth-warhead-red--p2815","name":"Warhead Red","image":"../images/musicians/Dave_Mustaine/warhead_red.jpg","sourceIds":[2815],"albums":["Rust in Peace"],"sourceCategories":["Dave Mustaine"],"badges":["ORIGINAL FMD"],"currentCategory":"Reimaginados FMD","inReimagined":true,"suspiciousName":false},{"designId":"cd-megadeth-youth-era--p30","name":"Youth Era","image":"../images/musicians/Nick_Menza/nick_menza_youth_era.jpg","sourceIds":[30],"albums":[],"sourceCategories":["Musician"],"badges":[],"currentCategory":"Dave Mustaine / miembros","inReimagined":false,"suspiciousName":false},{"designId":"cd-megadeth-youthanasia--youthanasia","name":"Youthanasia","image":"../images/albums/Youthanasia/youthanasia.jpg","sourceIds":[6,5064],"albums":["Youthanasia"],"sourceCategories":["Album","Hoodies FMD"],"badges":[],"currentCategory":"Youthanasia","inReimagined":false,"suspiciousName":false},{"designId":"cd-megadeth-youthanasia--youthanasia-fmd","name":"Youthanasia FMD","image":"../images/buzos cuello redondo/megadeth_youthanasia_original_fmd.jpg","sourceIds":[7007],"albums":["Youthanasia"],"sourceCategories":["Buzo Cuello Redondo"],"badges":[],"currentCategory":"Youthanasia","inReimagined":false,"suspiciousName":false}],CATEGORIES=["Killing Is My Business... and Business Is Good!","Peace Sells... but Who's Buying?","So Far, So Good... So What!","Rust in Peace","Countdown to Extinction","Youthanasia","Hidden Treasures","Cryptic Writings","Risk","The World Needs a Hero","The System Has Failed","United Abominations","Endgame","TH1RT3EN","Super Collider","Dystopia","The Sick, the Dying... and the Dead!","Megadeth (2026)","Singles / EP / recopilatorios","Vic Rattlehead","Dave Mustaine / miembros","Tours / clásicos","Reimaginados FMD","Otro / revisar"],KEY='fmd-megadeth-nombres-categorias-v1',PAGE=48;let limit=PAGE;const state=load(),grid=document.getElementById('grid'),search=document.getElementById('search'),category=document.getElementById('category'),review=document.getElementById('review');function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}function save(){localStorage.setItem(KEY,JSON.stringify(state));stats()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){return String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}function decision(id){return state[id]||{name:'',category:'',note:''}}function changed(id){const d=decision(id);return !!(d.name.trim()||d.category||d.note.trim())}function options(selected){return '<option value="">Sin cambio</option>'+CATEGORIES.map(v=>'<option '+(selected===v?'selected ':'')+'value="'+esc(v)+'">'+esc(v)+'</option>').join('')}[...new Set(DESIGNS.map(x=>x.currentCategory))].sort((a,b)=>a.localeCompare(b,'es')).forEach(v=>category.insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'+esc(v)+'</option>'));function match(x){const q=norm(search.value);if(q&&!norm([x.name,x.designId,x.currentCategory,...x.albums,...x.sourceCategories].join(' ')).includes(q))return false;if(category.value&&x.currentCategory!==category.value)return false;if(review.value==='suspicious'&&!x.suspiciousName)return false;if(review.value==='reimagined'&&!x.inReimagined)return false;if(review.value==='changed'&&!changed(x.designId))return false;return true}function card(x){const d=decision(x.designId);return '<article class="card '+(x.suspiciousName?'suspicious ':'')+(changed(x.designId)?'changed':'')+'" data-id="'+esc(x.designId)+'"><button class="media"><img src="'+esc(x.image)+'" alt="'+esc(x.name)+'" loading="lazy">'+(x.suspiciousName?'<span class="flag">REVISAR NOMBRE</span>':'')+(x.inReimagined?'<span class="flag re">REIMAGINADOS</span>':'')+'</button><div class="copy"><div class="id">'+esc(x.designId)+'</div><h2>'+esc(x.name)+'</h2><div class="meta"><strong>Categoría actual:</strong> '+esc(x.currentCategory)+'<br><strong>Álbum:</strong> '+esc(x.albums.join(' · ')||'Sin álbum')+'<br><strong>Origen:</strong> '+esc(x.sourceIds.join(', '))+'</div><label class="field">Nuevo nombre público<input data-name value="'+esc(d.name)+'" placeholder="Dejar vacío para conservar"></label><label class="field">Nueva categoría<select data-category>'+options(d.category)+'</select></label><label class="field">Nota opcional<textarea data-note placeholder="Aclaración para aplicar el cambio">'+esc(d.note)+'</textarea></label></div></article>'}function render(){const all=DESIGNS.filter(match),visible=all.slice(0,limit);grid.innerHTML=visible.length?visible.map(card).join(''):'<div class="empty">No hay diseños con estos filtros.</div>';document.getElementById('loadWrap').hidden=visible.length>=all.length;document.getElementById('more').textContent='VER MÁS DISEÑOS ('+visible.length+' DE '+all.length+')';bind();stats(all.length)}function bind(){document.querySelectorAll('.card').forEach(el=>{const id=el.dataset.id,x=DESIGNS.find(v=>v.designId===id);el.querySelector('[data-name]').addEventListener('input',e=>{state[id]={...decision(id),name:e.target.value};save();el.classList.toggle('changed',changed(id))});el.querySelector('[data-category]').addEventListener('change',e=>{state[id]={...decision(id),category:e.target.value};save();el.classList.toggle('changed',changed(id));if(review.value==='changed')render()});el.querySelector('[data-note]').addEventListener('input',e=>{state[id]={...decision(id),note:e.target.value};save();el.classList.toggle('changed',changed(id))});el.querySelector('.media').addEventListener('click',()=>open(x))})}function output(){return DESIGNS.filter(x=>changed(x.designId)).map(x=>({design_id:x.designId,nombre_actual:x.name,nombre_publico_nuevo:decision(x.designId).name.trim(),categoria_actual:x.currentCategory,categoria_curada_nueva:decision(x.designId).category,nota:decision(x.designId).note.trim(),imagen_principal:x.image.startsWith('../')?x.image.slice(3):x.image,ids_origen:x.sourceIds}))}function stats(count){document.getElementById('stats').textContent=output().length+' cambios · '+(Number.isInteger(count)?count:DESIGNS.filter(match).length)+' visibles · '+DESIGNS.length+' diseños'}function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}document.getElementById('json').onclick=()=>download('megadeth-nombres-categorias-fmd.json',JSON.stringify({generatedAt:new Date().toISOString(),count:output().length,changes:output()},null,2),'application/json');document.getElementById('csv').onclick=()=>{const rows=output(),heads=['design_id','nombre_actual','nombre_publico_nuevo','categoria_actual','categoria_curada_nueva','nota','imagen_principal','ids_origen'],q=v=>'"'+String(Array.isArray(v)?v.join(' | '):v??'').replace(/"/g,'""')+'"',nl=String.fromCharCode(13,10);download('megadeth-nombres-categorias-fmd.csv',String.fromCharCode(65279)+[heads,...rows.map(r=>heads.map(k=>r[k]))].map(r=>r.map(q).join(',')).join(nl),'text/csv;charset=utf-8')};document.getElementById('clear').onclick=()=>{search.value='';category.value='';review.value='';limit=PAGE;render()};document.getElementById('reset').onclick=()=>{if(!confirm('¿Borrar todos los cambios guardados?'))return;Object.keys(state).forEach(k=>delete state[k]);save();render()};document.getElementById('more').onclick=()=>{limit+=PAGE;render()};[search,category,review].forEach(el=>el.addEventListener(el===search?'input':'change',()=>{limit=PAGE;render()}));const lightbox=document.getElementById('lightbox');function open(x){lightbox.querySelector('img').src=x.image;lightbox.querySelector('img').alt=x.name;lightbox.classList.add('open')}function close(){lightbox.classList.remove('open');lightbox.querySelector('img').src=''}lightbox.querySelector('button').onclick=close;lightbox.onclick=e=>{if(e.target===lightbox)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
